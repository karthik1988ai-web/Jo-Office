name: Web app

# Publishes Jo Office (index.html) to https://karthik1988ai-web.github.io/Jo-Office/
# One-time: repo Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: [index.html, .github/workflows/web.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only the page itself is published (not the bridge or Android code).
      - name: Collect the site
        run: mkdir _site && cp index.html _site/index.html && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
